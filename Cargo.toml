[package]
name = "realm-forge"
version = "0.1.0"
edition = "2021"
description = "A local-first character and world builder"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
